<!DOCTYPE html>
<html lang="th" style="--cell-w: 127px; --chord-font: 'Roboto Condensed';"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Resistance · Muse · 80/20 Prototype</title>
<style>
:root{--bg:#f7f9fc;--surface:#fff;--border:#dfe7f2;--border-strong:#c8d4e3;--text:#172033;--text-muted:#7d8ca0;--text-faint:#b7c3d1;--accent:#334155;--ui-ink:#5f6f83;--ui-muted:#9aa8ba;--ui-line:#e6edf5;--ui-soft:#f3f7fb;--ui-hover:#edf3f9;--ui-active:#60758d;--cell-w:164px;--cell-h:64px;--gap:6px;--radius:5px;--chord-font:'Roboto Condensed';--note-font:'IBM Plex Sans Thai Looped',sans-serif;--ui-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'IBM Plex Sans Thai',sans-serif;color:var(--text);min-height:100vh;padding:0 0 80px}
/* ── Toolbar ── */
#toolbar{position:sticky;top:0;z-index:100;transition:transform .18s ease;background:rgba(255,255,255,0.97);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--ui-line);padding:4px 14px;display:flex;align-items:center;flex-wrap:wrap;gap:0;row-gap:3px;font-family:var(--ui-font);will-change:transform}
.tb-group{display:flex;align-items:center;gap:3px;padding:1px 0;flex-shrink:0}
.tb-group+.tb-group{border-left:1px solid var(--ui-line);margin-left:6px;padding-left:8px}
.tb-group-export{padding-left:8px}
.save-state{font-family:var(--ui-font);font-size:10px;color:var(--ui-muted);white-space:nowrap;margin-left:4px}
.save-state.dirty{color:#b45309;font-weight:600}
.save-state.saved{color:#2f855a}
.tb-flex-spacer{flex:1 1 auto;min-width:28px}
.tb-sep{display:none}
.tb-group-label{font-size:12px;font-weight:300;color:var(--ui-muted);letter-spacing:.012em;padding:0 5px 0 3px;user-select:none;white-space:nowrap;flex-shrink:0}
.tb-btn{font-size:12px;font-weight:400;padding:4px 8px;border:none;border-radius:6px;background:transparent;color:var(--ui-ink);cursor:pointer;transition:background .1s,color .1s;font-family:inherit;white-space:nowrap;height:27px;display:inline-flex;align-items:center;gap:4px;letter-spacing:.012em;flex-shrink:0;text-transform:lowercase}
.tb-btn:hover{background:var(--ui-hover);color:var(--ui-ink)}
.tb-btn:active{background:var(--ui-line)}
.tb-btn.active{background:var(--ui-active);color:#f8fbff;font-weight:400}
.tb-btn.active:hover{background:#526a82}
.tb-btn.home-btn{font-size:15px;width:26px;justify-content:center;padding:4px 0;color:var(--ui-muted)}
.tb-btn.home-btn:hover{color:var(--ui-ink)}
.tb-btn.primary{background:var(--ui-active);color:#f8fbff;font-weight:400}
.tb-btn.primary:hover{background:#526a82}
.tb-btn.ghost{color:var(--ui-muted)}
.tb-btn.ghost:hover{background:var(--ui-hover);color:var(--ui-ink)}
.seg-ctrl{display:flex;align-items:center;background:var(--ui-soft);border-radius:6px;overflow:hidden;height:26px;flex-shrink:0}
.seg-btn{font-size:12px;font-weight:400;padding:0 7px;background:transparent;border:none;color:var(--ui-muted);cursor:pointer;font-family:inherit;height:100%;transition:background .1s,color .1s;letter-spacing:.012em;line-height:1}
.seg-btn:hover{background:var(--ui-hover);color:var(--ui-ink)}
.seg-val{font-size:12px;font-family:inherit;font-weight:300;color:var(--ui-muted);padding:0 7px;min-width:29px;text-align:center;user-select:none;border-left:1px solid var(--ui-line);border-right:1px solid var(--ui-line);letter-spacing:.012em}
.seg-val.clickable{cursor:pointer;transition:color .1s}
.seg-val.clickable:hover{color:var(--ui-ink)}
.seg-val.transposed{color:var(--ui-ink);font-weight:400}
.duration-input{font-family:inherit;font-size:12px;font-weight:300;color:var(--ui-muted);border:none;background:var(--ui-soft);outline:none;width:42px;height:26px;padding:0 7px;border-radius:6px;letter-spacing:.012em}
.duration-input:hover,.duration-input:focus{background:var(--ui-hover);color:var(--ui-ink)}

/* ── Metabar ── */
#metabar{background:var(--surface);border-bottom:1px solid var(--border);padding:6px 24px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;transition:transform .18s ease,opacity .18s ease;will-change:transform,opacity}
.meta-label{font-size:12px;color:var(--ui-muted);font-family:var(--ui-font);font-weight:300;letter-spacing:.012em;text-transform:none;margin-right:2px}
.tb-filename,.tb-artist,.meta-input{font-family:var(--ui-font);font-size:12px;font-weight:700;color:var(--ui-ink);border:none;background:var(--ui-soft);outline:none;padding:3px 8px;border-radius:4px;transition:background .12s,color .12s;min-width:20px;letter-spacing:.012em}
.tb-filename::placeholder,.tb-artist::placeholder,.meta-input::placeholder{color:var(--ui-muted);opacity:1;font-weight:700}
.tb-filename{width:170px}
.tb-artist{width:170px}
.meta-input{max-width:90px}
.tb-filename:hover,.tb-artist:hover,.meta-input:hover{background:var(--ui-hover);color:var(--ui-ink)}
.tb-filename:focus,.tb-artist:focus,.meta-input:focus{background:var(--ui-hover);color:var(--ui-ink);box-shadow:none}
.top-brand{font-size:12px;font-weight:400;font-family:inherit;color:var(--ui-muted);text-decoration:none;white-space:nowrap;transition:opacity .12s;flex-shrink:0;display:inline-flex;align-items:baseline;gap:6px;letter-spacing:.012em}
.top-brand:hover{opacity:.75}
.brand-version{font-size:12px;font-weight:300;color:var(--ui-muted)}
.meta-sep{color:var(--border-strong);font-size:12px;margin:0 4px}
body.bars-hidden #toolbar{transform:translateY(calc(-1 * var(--toolbar-hide-y,56px)))}
body.bars-hidden #metabar{transform:translateY(calc(-1 * (var(--toolbar-hide-y,56px) + var(--metabar-hide-y,36px))));opacity:0;pointer-events:none}
body.autoscroll-on #toolbar,body.autoscroll-on #metabar{display:none!important}
body.autoscroll-on #footer-section{display:none!important}
.scroll-hud{position:fixed;right:14px;bottom:14px;z-index:120;display:none;align-items:center;gap:6px;padding:6px 7px;border:1px solid var(--ui-line);border-radius:8px;background:rgba(255,255,255,.96);box-shadow:0 4px 18px rgba(23,32,51,.12);font-family:var(--ui-font)}
body.autoscroll-on .scroll-hud{display:flex}
.scroll-hud .tb-btn{height:24px;padding:3px 8px}
.scroll-hud .jump-btn{width:24px;justify-content:center;padding:3px 0}
.scroll-hud .seg-ctrl{height:24px}
.scroll-hud .seg-btn{padding:0 8px}
.scroll-hud-text{font-size:12px;font-weight:300;color:var(--ui-muted);min-width:40px;text-align:center}
/* ── Sheet ── */
#sheet{padding:8px 24px 24px;overflow-x:auto}
.section{width:var(--note-content-w,auto);max-width:100%;margin:0 auto 18px}
body.edit-mode .section{width:100%}
/* Section head */
.section-head{display:flex;align-items:center;gap:7px;width:100%;max-width:100%;margin:0 0 6px;padding:0 2px;flex-wrap:wrap}
body.edit-mode .section-head{display:grid;grid-template-columns:32px var(--note-content-w,100%) 72px;column-gap:7px;justify-content:center;align-items:center;padding:0 2px}
body.edit-mode .section-head-main{display:flex;align-items:center;gap:7px;min-width:0}
.section-tag{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:3px;cursor:pointer;transition:opacity .12s;border:1px solid transparent;white-space:nowrap}
.section-tag:hover{opacity:.8}
.note-type-sec .section-tag{display:none!important}
.section-label-inp{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid;background:transparent;color:inherit;border-radius:3px;padding:2px 7px;outline:none;font-family:inherit;min-width:40px;max-width:140px}
.note-toggle{font-size:10px;color:var(--text-faint);background:none;border:1px dashed transparent;border-radius:3px;padding:2px 6px;cursor:pointer;font-family:inherit;transition:all .12s;white-space:nowrap;flex-shrink:0}
.note-toggle:hover{color:var(--text-muted);border-color:var(--border)}
.note-toggle.note-on{color:var(--text-muted);border-style:solid;border-color:var(--border-strong)}
.section-note{font-size:11px;color:var(--text-muted);font-family:var(--ui-font);border:none;background:transparent;outline:none;cursor:text;flex:1;min-width:40px}
.section-note:focus{background:var(--bg);border-radius:2px;padding:0 3px;color:var(--text)}
.section-actions{display:flex;gap:4px;margin-left:auto;flex-shrink:0}
body.edit-mode .section-actions{margin-left:0;justify-self:start}
.sheet-add-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.sec-btn{font-size:10px;color:var(--text-muted);background:none;border:1px dashed var(--border-strong);border-radius:3px;padding:2px 8px;cursor:pointer;transition:all .12s;font-family:inherit;white-space:nowrap}
.sec-btn:hover{color:var(--text);border-color:var(--accent);background:var(--bg)}
.sec-btn-danger{color:#dc2626!important}
.sec-btn-danger:hover{border-color:#dc2626!important;background:#fff1f1!important}
.sec-btn-warn{color:#d97706!important}
.sec-btn-warn:hover{border-color:#d97706!important;background:#fffbeb!important}
.sec-btn:disabled{opacity:.3;cursor:default;pointer-events:none}
/* ── Note section ── */
.sec-note-wrap{padding:0 2px 10px 2px}
body.edit-mode .sec-note-wrap{display:grid;grid-template-columns:32px var(--note-content-w,100%) 72px;column-gap:7px;align-items:start;justify-content:center;padding-left:2px}
body.edit-mode .note-type-sec .sec-order-inp{margin-top:0}
.sec-note-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:var(--note-content-w,100%);max-width:100%;margin:0 auto}
body.edit-mode .sec-note-cols{width:var(--note-content-w,100%);margin:0}
.sec-note-cols.note-cols-single{grid-template-columns:minmax(0,1fr)}
.sec-note-col{display:flex;flex-direction:column;gap:4px;min-width:0}
.rte-toolbar{display:none!important}
body:not(.edit-mode) .rte-toolbar{display:none!important}
.rte-btn{font-size:10px;font-family:var(--ui-font);font-weight:600;padding:2px 7px;border:1px solid var(--border-strong);border-radius:3px;background:var(--surface);cursor:pointer;color:var(--text-muted);transition:all .12s;line-height:1.5}
.rte-btn:hover{background:var(--bg);color:var(--text);border-color:var(--accent)}
.rte-btn.rte-sep{border:none;color:var(--border-strong);padding:0 2px;cursor:default}
.rte-editor{min-height:60px;border-left:2px solid transparent;padding:8px 2px 8px 10px;font-family:var(--note-font);font-size:20px;font-weight:400;color:var(--text);background:var(--surface);line-height:1.65;border-radius:0 var(--radius) var(--radius) 0;outline:none;overflow:auto;min-width:0;overflow-wrap:anywhere}
.rte-editor:focus{background:var(--bg)}
.rte-editor:empty::before{content:''}
.rte-editor a{color:#2563eb;text-decoration:underline}
.rte-editor img{max-width:100%;border-radius:4px;margin:4px 0;display:block}
@media(max-width:768px){.sec-note-cols{grid-template-columns:1fr}}
/* ── Bar rows ── */
.bar-row{display:flex;flex-wrap:nowrap;align-items:flex-end;justify-content:flex-start;gap:var(--gap);min-height:calc(var(--cell-h) + 4px);padding:3px 2px;border-radius:4px;transition:background .1s}
body.edit-mode .bar-row{display:grid;grid-template-columns:32px var(--note-content-w,100%) 72px;column-gap:7px;align-items:end;justify-content:center;width:100%;padding:2px 2px}
.bar-row.drag-over{background:rgba(59,130,246,.07);outline:2px dashed #3b82f6;outline-offset:-2px}
.row-ctrl{display:flex;align-items:flex-start;justify-content:center;flex-shrink:0;width:28px;align-self:start;padding-top:10px}
.bar-row-main{display:flex;flex-wrap:nowrap;align-items:flex-end;justify-content:flex-start;gap:var(--gap);min-width:0;flex:0 0 auto}
body.edit-mode .bar-row-main{width:var(--note-content-w,100%)}
.row-repeat-ctrl{display:flex;align-items:flex-end;justify-content:flex-end;gap:3px;min-width:0}
body:not(.edit-mode) .row-repeat-ctrl:empty{display:none}
/* rail-text: quiet editor rail labels, matching the top menu "view" text. */
.rail-text,.sec-order-inp{font-family:var(--ui-font);font-size:12px;font-weight:300;letter-spacing:.012em;color:var(--ui-muted);line-height:1}
/* row-size-text: smaller bar-count controls in the row rail. */
.row-size-text,.row-cols-inp,.bar-count-inp,.bar-count-btn{font-family:var(--ui-font);font-size:9px;font-weight:300;letter-spacing:.012em;color:var(--ui-muted);line-height:1}
.row-cols-inp{width:22px;text-align:center;border:none;border-radius:0;padding:2px 1px;background:transparent;outline:none;cursor:ns-resize;-moz-appearance:textfield}
.row-cols-inp::-webkit-outer-spin-button,.row-cols-inp::-webkit-inner-spin-button{-webkit-appearance:none}
.row-cols-inp:hover{background:transparent;color:var(--ui-ink)}
.row-cols-inp:focus{background:transparent;color:var(--ui-ink);cursor:text}
/* ── Bar cells ── */
.bar-cell{width:var(--cell-w);min-height:var(--cell-h);border-radius:var(--radius);border:1px solid var(--border);padding:12px 8px 24px;display:flex;flex-direction:column;gap:2px;cursor:grab;user-select:none;transition:box-shadow .12s,transform .1s,opacity .1s;position:relative;background:var(--surface)}
.bar-cell:active{cursor:grabbing}
.bar-cell.dragging{opacity:.12;transform:scale(.93);pointer-events:none;transition:none}
.bar-cell.drag-over-left{box-shadow:none}
.bar-cell.drag-over-left::before{content:'';position:absolute;left:-4px;top:4px;bottom:4px;width:3px;border-radius:3px;background:#3b82f6;z-index:10}
.bar-cell:hover{box-shadow:0 2px 8px rgba(0,0,0,.09);z-index:2}
/* Bar number — top left, accent colour set inline */
.bar-num{font-family:var(--ui-font);font-size:10px;font-weight:600;line-height:1;position:absolute;top:4px;left:6px;opacity:.7}
/* Bar special note — top right, section lbl colour */
.bar-snote{position:absolute;top:4px;left:calc(6px + 20px + 4px);right:6px;font-family:var(--ui-font);font-size:10px;font-weight:700;line-height:1;background:transparent;border:none;outline:none;text-align:right;cursor:text;white-space:nowrap;padding:0;min-width:0}
.bar-snote::placeholder{color:transparent}
body.edit-mode .bar-snote::placeholder{color:transparent}
body.view-mini .bar-snote{font-size:9px;top:3px}
.bar-chord{font-family:var(--chord-font),sans-serif;font-size:14.5px;font-weight:700;color:var(--text);line-height:1.12;cursor:text;outline:none;width:100%;padding:0;word-break:normal;overflow-wrap:normal;white-space:pre-wrap;flex:1}
.bar-chord:focus{background:rgba(0,0,0,.04);border-radius:2px;padding:0 2px;margin:0 -2px}
.bar-chord-split{display:grid;width:100%;min-height:1.25em;align-self:center;flex:1;border:none;border-radius:0;overflow:hidden;background:transparent}
.bar-chord-part{font-family:var(--chord-font),sans-serif;font-size:14.5px;font-weight:700;line-height:1.12;color:var(--text);cursor:text;outline:none;min-width:0;padding:0 2px;white-space:pre-wrap;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:flex-start;border-left:none}
.bar-chord-part:focus{background:rgba(0,0,0,.035);border-radius:2px}
body.view-mini .bar-chord-split{min-height:22px}
body.view-mini .bar-chord-part{font-weight:700;line-height:1.05;padding:0 1px;align-items:center}
.bar-ann{font-size:10px;color:var(--text-muted);cursor:text;border:none;background:transparent;outline:none;width:100%;padding:0;font-family:inherit;line-height:1.2}
.bar-ann:focus{background:rgba(0,0,0,.03);border-radius:2px;padding:0 2px}
.bar-ann::placeholder{color:transparent}
body.view-mini .bar-ann-empty{height:0;min-height:0;line-height:0;opacity:0;pointer-events:none}
.del-btn{position:absolute;right:3px;bottom:3px;width:14px;height:14px;border-radius:50%;background:none;border:none;color:var(--text-faint);font-size:11px;line-height:14px;text-align:center;cursor:pointer;display:none;padding:0}
.bar-cell:hover .del-btn{display:block}
.del-btn:hover{background:#fee2e2;color:#dc2626}
.add-bar-cell{display:none!important}
/* Highlight */
.bar-cell.highlighted{outline-offset:-1px;z-index:3}
.bar-cell.highlighted,.bar-cell.highlighted .bar-num,.bar-cell.highlighted .bar-snote,.bar-cell.highlighted .bar-chord,.bar-cell.highlighted .bar-chord-part,.bar-cell.highlighted .bar-ann{color:#fff!important}
.bar-cell.highlighted .bar-snote::placeholder,.bar-cell.highlighted .bar-ann::placeholder{color:transparent!important}
.bar-cell.highlighted .bar-chord:focus,.bar-cell.highlighted .bar-chord-part:focus,.bar-cell.highlighted .bar-ann:focus,.bar-cell.highlighted .bar-snote:focus{background:rgba(255,255,255,.12)}
/* Highlight btn — bottom LEFT */
.bar-bottom{position:absolute;bottom:4px;left:4px;display:flex;gap:4px;align-items:center;opacity:0;pointer-events:none;transition:opacity .12s}
.highlight-btn,.rhythm-bar-btn,.count-bypass-btn{width:13px;height:13px;background:transparent;border:0;color:rgba(0,0,0,.13);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:2px 0 0;line-height:1;text-align:center;opacity:.62;font:700 9px/1 var(--ui-font);transition:opacity .15s,background .15s,color .15s}
.highlight-btn{border-radius:1px}
.rhythm-bar-btn{border-radius:1px;flex-shrink:0}
body.edit-mode .bar-cell:hover .bar-bottom,body.edit-mode .bar-cell:focus-within .bar-bottom{opacity:.9;pointer-events:auto}
.highlight-btn:hover,.rhythm-bar-btn:hover,.count-bypass-btn:hover{opacity:1;background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.18);color:rgba(0,0,0,.42)}
.bar-cell.highlighted .highlight-btn{color:rgba(0,0,0,.10)}
.bar-cell.highlighted .bar-bottom button:hover{background:rgba(255,255,255,.15);color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.45)}
/* ── Edit mode ── */
body:not(.edit-mode) .del-btn{display:none!important}
body:not(.edit-mode) .bar-bottom{display:none!important}
body:not(.edit-mode) .add-bar-cell{display:none!important}
body:not(.edit-mode) .section-actions{display:none!important}
body:not(.edit-mode) .sheet-add-actions{display:none!important}
body:not(.edit-mode) .row-ctrl{display:none!important}
.sec-order-inp{width:32px;text-align:center;border:none;border-radius:0;padding:2px 1px;background:transparent;outline:none;-moz-appearance:textfield;flex-shrink:0}
.sec-order-inp::-webkit-outer-spin-button,.sec-order-inp::-webkit-inner-spin-button{-webkit-appearance:none}
.sec-order-inp:hover{background:transparent;color:var(--ui-ink)}
.sec-order-inp:focus{background:transparent;color:var(--ui-ink)}
body:not(.edit-mode) .sec-order-inp{display:none!important}
.note-edit-rail{display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:0;position:relative;overflow:visible}
.note-edit-rail .sec-order-inp{margin-top:0!important}
.note-col-btn{font-family:var(--ui-font);font-size:9px;font-weight:300;letter-spacing:.012em;color:var(--ui-muted);background:rgba(148,168,186,.13);border:none;border-radius:3px;padding:3px 5px;cursor:pointer;white-space:nowrap;line-height:1}
.note-col-btn:hover{background:rgba(148,168,186,.18);color:var(--ui-ink)}
.note-col-btn.note-del-btn{color:#dc2626;background:transparent;font-size:11px;padding:2px 4px}
.note-col-btn.note-del-btn:hover{background:#fff1f1;color:#dc2626}
.bar-count-inp{width:20px;text-align:center;border:none;border-radius:3px;padding:3px 1px;margin-left:12px;margin-right:-2px;background:rgba(148,168,186,.13);outline:none;-moz-appearance:textfield;flex-shrink:0}
.bar-count-inp::-webkit-outer-spin-button,.bar-count-inp::-webkit-inner-spin-button{-webkit-appearance:none}
.bar-count-inp:hover,.bar-count-inp:focus{background:rgba(148,168,186,.18);color:var(--ui-ink)}
.bar-count-btn{padding-left:6px;padding-right:6px}
/* ── Color picker ── */
.color-popup{position:fixed;z-index:500;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:12px;box-shadow:0 4px 24px rgba(0,0,0,.12);min-width:220px;display:none}
.color-popup.open{display:block}
.color-popup-title{font-family:var(--ui-font);font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}
.color-swatches{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.swatch-row-label{font-family:var(--ui-font);font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:4px}
.swatch{width:24px;height:24px;border-radius:4px;cursor:pointer;border:2px solid rgba(255,255,255,.95);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);transition:transform .1s,border-color .1s,box-shadow .1s;flex-shrink:0}
.swatch:hover{transform:scale(1.12);box-shadow:inset 0 0 0 1px rgba(0,0,0,.10),0 0 0 2px var(--ui-line)}

<script>
// ── Auto-hide toolbar + metabar on scroll (rehearsal mode) ──
document.addEventListener('DOMContentLoaded',function(){
  var lastY=window.scrollY,ticking=false,hidden=false;
  var tb=document.getElementById('toolbar');
  var mb=document.getElementById('metabar');
  function clampScrollY(){
    var doc=document.documentElement;
    var max=Math.max(0,doc.scrollHeight-window.innerHeight);
    return Math.max(0,Math.min(window.scrollY||0,max));
  }
  function updateHideMetrics(){
    if(tb)document.documentElement.style.setProperty('--toolbar-hide-y',(tb.offsetHeight+2)+'px');
    if(mb)document.documentElement.style.setProperty('--metabar-hide-y',(mb.offsetHeight+2)+'px');
  }
  function setBarsHidden(next){
    if(hidden===next)return;
    hidden=next;
    document.body.classList.toggle('bars-hidden',hidden);
  }
  updateHideMetrics();
  window.addEventListener('resize',updateHideMetrics,{passive:true});
  window.addEventListener('scroll',function(){
    if(ticking)return;ticking=true;
    requestAnimationFrame(function(){
      var y=clampScrollY(),delta=y-lastY;
      if(Math.abs(delta)<4){ticking=false;return;}
      if(delta>0&&y>60)setBarsHidden(true);
      else if(delta<0)setBarsHidden(false);
      lastY=y;ticking=false;
    });
  },{passive:true});
});
</script>

function hexToRgb(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)}}
function toHex(r,g,b){return'#'+[r,g,b].map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
function lighten(h,a){var c=hexToRgb(h);return toHex(Math.min(255,c.r+Math.round((255-c.r)*a)),Math.min(255,c.g+Math.round((255-c.g)*a)),Math.min(255,c.b+Math.round((255-c.b)*a)))}
function darken(h,a){var c=hexToRgb(h);return toHex(Math.max(0,Math.round(c.r*(1-a))),Math.max(0,Math.round(c.g*(1-a))),Math.max(0,Math.round(c.b*(1-a))))}
function isHex(h){return/^#[0-9a-fA-F]{6}$/.test(h)}
function colorFromBar(bar){return{bar:bar,bg:lighten(bar,.88),lbl:darken(bar,.35)}}

function noteColHasContent(html){
  var tmp=document.createElement('div');
  tmp.innerHTML=html||'';
  if(tmp.querySelector('img,video,audio,iframe,svg,table,hr'))return true;
  return (tmp.textContent||'').replace(/\u00a0/g,' ').trim().length>0;
}

function blankBar(){return{c:'—',a:'',h:false}}
function ensureRowSizes(sec,rowIndex){
  if(!sec.rowSizes)sec.rowSizes=[];
  while(sec.rowSizes.length<=rowIndex)sec.rowSizes.push(DEFAULT_ROW_SIZE);
}
function resizeRow(si,rowIndex,newSize){
  var sec=SECTIONS[si];if(!sec||!sec.bars)return;
  newSize=Math.max(1,Math.min(parseInt(newSize,10)||DEFAULT_ROW_SIZE,COLS));
  var rows=baseRowsFor(sec),row=rows[rowIndex];if(!row)return;
  var entries=rows.map(function(r,idx){
    return{size:r.end-r.start,group:sec.rowRepeatGroups&&sec.rowRepeatGroups[idx]};
  });
  var oldSize=entries[rowIndex].size;
  newSize=Math.min(newSize,sec.bars.length-row.start);
  if(newSize<oldSize){
    var splitGroup=entries[rowIndex].group;
    entries.splice(rowIndex,1,{size:newSize,group:splitGroup},{size:oldSize-newSize,group:splitGroup});
  }else if(newSize>oldSize){
    var extra=newSize-oldSize,next=rowIndex+1;
    entries[rowIndex].size=newSize;
    while(extra>0&&next<entries.length){
      if(entries[next].size>extra){
        entries[next].size-=extra;
        extra=0;
      }else{
        extra-=entries[next].size;
        entries.splice(next,1);
      }
    }
    if(extra>0)entries[rowIndex].size-=extra;
  }
  sec.rowSizes=entries.map(function(e){return e.size}).filter(function(n){return n>0});
  if(sec.rowRepeatGroups){
    var groups={};
    entries.forEach(function(e,idx){if(e.group)groups[idx]=e.group});
    sec.rowRepeatGroups=Object.keys(groups).length?groups:{};
  }
  render();
}
function normalizeTrailingRows(sec){
  if(!sec||!sec.bars)return;
  var sizes=(sec.rowSizes||[]).slice(),total=0,out=[];
  for(var i=0;i<sizes.length&&total<sec.bars.length;i++){
    var size=Math.max(1,Math.min(parseInt(sizes[i],10)||DEFAULT_ROW_SIZE,COLS));
    if(total+size>sec.bars.length)size=sec.bars.length-total;
    out.push(size);total+=size;
  }
  while(total<sec.bars.length){
    var add=Math.min(DEFAULT_ROW_SIZE,sec.bars.length-total);
    out.push(add);total+=add;
  }
  sec.rowSizes=out;
}
function appendBarsToRowSizes(sec,count){
  if(!sec||!sec.bars)return;
  var rows=baseRowsFor(sec);
  var entries=rows.map(function(r,idx){
    return{size:r.end-r.start,group:sec.rowRepeatGroups&&sec.rowRepeatGroups[idx]};
  });
  if(!entries.length)entries.push({size:0,group:''});
  var remaining=count,last=entries[entries.length-1];
  if(last&&!last.group&&last.size<DEFAULT_ROW_SIZE){
    var grow=Math.min(DEFAULT_ROW_SIZE-last.size,remaining);
    last.size+=grow;remaining-=grow;
  }
  while(remaining>0){
    var add=Math.min(DEFAULT_ROW_SIZE,remaining);
    entries.push({size:add,group:''});remaining-=add;
  }
  sec.rowSizes=entries.map(function(e){return e.size}).filter(function(n){return n>0});
  if(sec.rowRepeatGroups){
    var groups={};
    entries.forEach(function(e,idx){if(e.group)groups[idx]=e.group});
    sec.rowRepeatGroups=Object.keys(groups).length?groups:{};
  }
}

function changeSectionBars(si,count,dir){

    for(var i=0;i<count;i++)sec.bars.push(blankBar());
    render();toast('เพิ่ม '+count+' ห้องแล้ว');return;
  }
  var removable=Math.max(0,sec.bars.length-1);
  var remove=Math.min(count,removable);
  if(remove<=0){toast('ต้องมีอย่างน้อย 1 ห้อง');return;}
  sec.bars.splice(sec.bars.length-remove,remove);
  normalizeTrailingRows(sec);render();toast('ลบ '+remove+' ห้องแล้ว');
}
function countedBarsInRow(sec,row){

function repeatCountForGroup(sec,group){

}
function repeatExtraForRow(sec,rowIndex){
  var groups=sec.rowRepeatGroups||{};
  var group=groups[rowIndex];
  var repeat=repeatCountForGroup(sec,group);
  if(!group||!repeat||repeat<=1||groups[rowIndex+1]===group)return 0;

  for(var ri=start;ri<=rowIndex;ri++)if(rows[ri])played+=countedBarsInRow(sec,rows[ri]);

function updateCellWidth(){
  var sheet=document.getElementById('sheet');
  var sheetStyle=sheet?getComputedStyle(sheet):null;
  var sheetW=sheet?sheet.clientWidth:document.documentElement.clientWidth;
  var pad=(sheetStyle?parseFloat(sheetStyle.paddingLeft)+parseFloat(sheetStyle.paddingRight):48)||0;
  var gap=parseFloat(getComputedStyle(document.body).getPropertyValue('--gap'))||(VIEW==='mini'?3:6);
  var rowPad=4;
  var ctrlW=EDIT_MODE?(32+72+14):0;
  var cols=EDIT_MODE?8:visualColsFor(8);
  var gaps=(cols-1)*gap;
  var narrow=(window.innerWidth||document.documentElement.clientWidth||1024)<=520;
  var repeatReserve=(!EDIT_MODE&&cols<=4)?30:0;
  var avail=sheetW-pad-rowPad-ctrlW-gaps-repeatReserve-2;
  var minW=narrow&&cols<=4?72:(cols<=2?150:(cols<=4?118:96));
  var maxW=narrow&&cols<=4?96:(cols<=2?224:(cols<=4?170:138));
  var w=Math.max(minW,Math.min(maxW,Math.floor(avail/cols)));
  document.documentElement.style.setProperty('--cell-w',w+'px');
  syncNoteWidths();
}
function measureRowContentWidth(row){
  var left=Infinity,right=-Infinity;
  function addRect(el){
    var st=getComputedStyle(el);
    if(st.display==='none'||st.visibility==='hidden')return;
    var r=el.getBoundingClientRect();
    if(r.width<=0||r.height<=0)return;
    left=Math.min(left,r.left);right=Math.max(right,r.right);
  }
  Array.prototype.forEach.call(row.children,function(child){
    if(child.classList&&(
      child.classList.contains('row-ctrl')||
      child.classList.contains('row-repeat-ctrl')||
      child.classList.contains('add-bar-cell')
    ))return;
    if(child.classList&&child.classList.contains('bar-row-main')){
      Array.prototype.forEach.call(child.children,addRect);
      return;
    }
    addRect(child);
  });
  return isFinite(left)?Math.ceil(right-left):0;
}
function syncNoteWidths(){
  var sheet=document.getElementById('sheet');if(!sheet)return;
  var globalMax=0,lastSectionW=0;
  sheet.querySelectorAll('.section').forEach(function(secEl){
    var sectionMax=0;
    secEl.querySelectorAll('.bar-row').forEach(function(row){sectionMax=Math.max(sectionMax,measureRowContentWidth(row))});
    if(sectionMax){
      lastSectionW=sectionMax;
      globalMax=Math.max(globalMax,sectionMax);
    }else if(secEl.classList.contains('note-type-sec')&&lastSectionW){
      sectionMax=lastSectionW;
    }
    if(sectionMax)secEl.style.setProperty('--section-content-w',Math.min(sectionMax,sheet.clientWidth)+'px');
    else secEl.style.removeProperty('--section-content-w');
  });
  if(!globalMax)globalMax=sheet.clientWidth;
  sheet.style.setProperty('--note-content-w',Math.min(globalMax,sheet.clientWidth)+'px');
}

function barHasVisibleRhythm(sec,bar){
  if(!bar||bar.rhythmOff)return false;
  return !!bar.rhythmOn||!!(sec&&sec.rhythmOn&&bar.r&&bar.r.length);
}

function chordSplitParts(chord){
  if(typeof chord!=='string'||chord.indexOf('|')<0)return null;
  return chord.split('|').map(function(part){return part.replace(/\s+$/,'').replace(/^\s+/,'')});
}
function chordSplitSegments(parts){
  var segments=[];
  if(!parts||parts.length<2)return segments;
  for(var i=0;i<parts.length;i++){
    var text=(parts[i]||'').trim();
    if(!text)continue;
    var span=1;
    while(i+span<parts.length&&!(parts[i+span]||'').trim())span++;
    segments.push({text:text,start:i,span:span});
  }
  if(!segments.length)segments.push({text:'—',start:0,span:parts.length});
  return segments;
}
function setSplitPart(secIdx,barIdx,slot,text){
  var current=(SECTIONS[secIdx]&&SECTIONS[secIdx].bars&&SECTIONS[secIdx].bars[barIdx]&&SECTIONS[secIdx].bars[barIdx].c)||'';
  var next=chordSplitParts(current)||[''];
  while(next.length<=slot)next.push('');
  next[slot]=(text||'').replace(/[\n\r|]/g,'').trim();
  SECTIONS[secIdx].bars[barIdx].c=next.join('|');
}
function openRawSplitEditor(wrap,bar,si,bi){
  var raw=document.createElement('div');
  raw.className='bar-chord';
  raw.contentEditable='true';
  raw.spellcheck=false;
  raw.textContent=(SECTIONS[si]&&SECTIONS[si].bars&&SECTIONS[si].bars[bi]&&SECTIONS[si].bars[bi].c)||bar.c||'';
  raw.style.fontSize=CHORD_SIZE+'px';
  if(bar.h)raw.style.color='#fff';
  raw.oninput=function(){SECTIONS[si].bars[bi].c=this.textContent.replace(/[\n\r]/g,'')};
  raw.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();this.blur()}};
  raw.onblur=function(){render()};
  raw.onmousedown=raw.onclick=function(e){e.stopPropagation()};
  wrap.replaceWith(raw);
  raw.focus();
  var range=document.createRange();
  range.selectNodeContents(raw);
  var sel=window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}
function makeChordSplitEl(bar,si,bi){
  var parts=chordSplitParts(bar.c);
  if(!parts)return null;
  var wrap=document.createElement('div');
  wrap.className='bar-chord-split';
  wrap.title=EDIT_MODE?'double click to edit raw split syntax':'';
  wrap.style.gridTemplateColumns='repeat('+parts.length+',minmax(0,1fr))';
  if(EDIT_MODE)wrap.ondblclick=function(e){e.stopPropagation();openRawSplitEditor(wrap,bar,si,bi)};
  chordSplitSegments(parts).forEach(function(seg){
    var part=document.createElement('div');
    part.className='bar-chord-part';
    part.textContent=seg.text;
    part.style.gridColumn=(seg.start+1)+' / span '+seg.span;
    part.style.fontSize=CHORD_SIZE+'px';
    if(bar.h)part.style.color='#fff';
    part.contentEditable=EDIT_MODE?'true':'false';
    part.spellcheck=false;
    if(EDIT_MODE){
      part.oninput=function(){setSplitPart(si,bi,seg.start,this.textContent)};
      part.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();this.blur()}};
    }
    part.onmousedown=part.onclick=function(e){e.stopPropagation()};
    wrap.appendChild(part);
  });
  return wrap;
}

function makeBarCol(bar,si,bi,num,col){
  var showRhythm=barHasVisibleRhythm(SECTIONS[si],bar);
  var barCol=document.createElement('div');
  barCol.className='bar-col'+(showRhythm?' has-rhythm':'');

  // Rhythm strip
  var strip=document.createElement('div');
  strip.className='rhythm-strip'+(showRhythm?'':' rhythm-strip-hidden');
  strip.style.background=col.bg;strip.style.color=col.lbl;
  strip.style.borderColor='transparent';
  var slots=(bar.r&&bar.r.length)?bar.r:[];
  if(!slots.length){
    var hint=document.createElement('span');hint.className='add-rhythm-hint';
    hint.textContent=EDIT_MODE?'+ add rhythm':'';strip.appendChild(hint);
    if(EDIT_MODE)strip.onclick=(function(s,b,el){return function(e){e.stopPropagation();openRhythmPicker(s,b,el)}})(si,bi,strip);
  } else {
    var sw=document.createElement('div');sw.className='beat-slots';
    slots.forEach(function(noteId,slotIdx){
      var slot=document.createElement('div');slot.className='beat-slot';
      var icon=svgEl(noteId,slots.length>5?'note-icon-sm':'note-icon');
      if(icon){icon.style.color=col.lbl;slot.appendChild(icon);}
      if(EDIT_MODE)slot.onclick=(function(s,b,idx,el){return function(e){e.stopPropagation();openBeatPicker(s,b,idx,el)}})(si,bi,slotIdx,slot);
      sw.appendChild(slot);
    });
    strip.appendChild(sw);
    if(EDIT_MODE)strip.ondblclick=(function(s,b,el){return function(e){e.stopPropagation();openRhythmPicker(s,b,el)}})(si,bi,strip);
  }
  barCol.appendChild(strip);

  // Chord cell (existing makeCell logic, adapted)
  var cell=document.createElement('div');
  cell.className='bar-cell'+(bar.h?' highlighted':'')+(bar.skipCount?' skip-count':'');
  cell.style.setProperty('--bar-strip',col.bar+'4a');
  cell.style.setProperty('--bar-num-color',col.lbl);
  cell.style.setProperty('--bar-accent',col.bar);
  if(bar.h){
    var hlBg=darken(col.bar,0.28);
    cell.style.background=hlBg;
    cell.style.borderColor=darken(col.bar,0.12);
    cell.style.outline='1px solid '+darken(col.bar,0.10);
  } else {
    cell.style.border='none';
    cell.style.background=col.bg;
  }
  // When rhythm strip is NOT shown, restore full border-radius on cell
  if(!showRhythm){
    cell.style.borderRadius='';
    cell.style.borderTop='none';
  }
	  cell.draggable=EDIT_MODE;cell.dataset.si=si;cell.dataset.bi=bi;
  var numEl=document.createElement('span');numEl.className='bar-num';numEl.textContent=num;
  numEl.style.color=bar.h?'rgba(255,255,255,0.75)':col.lbl;
  var snoteEl=document.createElement('input');snoteEl.type='text';snoteEl.className='bar-snote';
  snoteEl.spellcheck=false;snoteEl.autocomplete='off';snoteEl.autocapitalize='off';
	  snoteEl.value=bar.sn||'';
	  snoteEl.readOnly=!EDIT_MODE;
  snoteEl.style.color=bar.h?'rgba(255,255,255,0.85)':col.lbl;
  snoteEl.oninput=(function(s,b){return function(){SECTIONS[s].bars[b].sn=this.value}})(si,bi);
  snoteEl.onmousedown=snoteEl.onclick=function(e){e.stopPropagation()};
  var chordEl=makeChordSplitEl(bar,si,bi);
  if(!chordEl){
	    chordEl=document.createElement('div');chordEl.className='bar-chord';chordEl.contentEditable=EDIT_MODE?'true':'false';
    chordEl.spellcheck=false;chordEl.setAttribute('autocomplete','off');chordEl.setAttribute('autocapitalize','off');chordEl.setAttribute('autocorrect','off');
    chordEl.textContent=bar.c;chordEl.style.fontSize=CHORD_SIZE+'px';
    if(bar.h)chordEl.style.color='#fff';
    chordEl.oninput=(function(s,b){return function(){SECTIONS[s].bars[b].c=this.textContent.replace(/[\n\r]/g,'')}})(si,bi);
    chordEl.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();this.blur()}};
    chordEl.onblur=(function(s,b){return function(){if((SECTIONS[s].bars[b].c||'').indexOf('|')>=0)render()}})(si,bi);
    chordEl.onmousedown=chordEl.onclick=function(e){e.stopPropagation()};
  }
	  var annEl=document.createElement('input');annEl.className='bar-ann'+(bar.a?'':' bar-ann-empty');annEl.value=bar.a||'';
	  annEl.readOnly=!EDIT_MODE;
  annEl.spellcheck=false;annEl.autocomplete='off';annEl.autocapitalize='off';
  annEl.oninput=(function(s,b){return function(){SECTIONS[s].bars[b].a=this.value}})(si,bi);
  annEl.onmousedown=annEl.onclick=function(e){e.stopPropagation()};
  var delBtn=document.createElement('button');delBtn.className='del-btn';delBtn.textContent='×';
  delBtn.onclick=(function(s,b){return function(e){e.stopPropagation();deleteBar(s,b)}})(si,bi);
  var hlBtn=document.createElement('button');hlBtn.className='highlight-btn';hlBtn.textContent='@';hlBtn.title='Toggle highlight';
  hlBtn.onclick=(function(s,b){return function(e){e.stopPropagation();SECTIONS[s].bars[b].h=!SECTIONS[s].bars[b].h;render()}})(si,bi);
  var skipBtn=document.createElement('button');skipBtn.className='count-bypass-btn';skipBtn.textContent='#';skipBtn.title='Bypass bar number count';
  skipBtn.onclick=(function(s,b){return function(e){e.stopPropagation();SECTIONS[s].bars[b].skipCount=!SECTIONS[s].bars[b].skipCount;render()}})(si,bi);
  var rbarBtn=document.createElement('button');
  rbarBtn.className='rhythm-bar-btn'+(showRhythm?' on':'')+(bar.rhythmOff?' forced-show':'');
  rbarBtn.textContent='%';
  rbarBtn.title=showRhythm?'Hide rhythm for this bar':'Add rhythm to this bar';
  rbarBtn.onclick=(function(s,b){return function(e){
    e.stopPropagation();
    var bar=SECTIONS[s].bars[b];
    var visible=barHasVisibleRhythm(SECTIONS[s],bar);
    if(visible){bar.rhythmOn=false;bar.rhythmOff=true;}
    else{bar.rhythmOn=true;bar.rhythmOff=false;}
    render();
  }})(si,bi);
  var barBottom=document.createElement('div');barBottom.className='bar-bottom';
  barBottom.appendChild(hlBtn);barBottom.appendChild(skipBtn);barBottom.appendChild(rbarBtn);
  cell.appendChild(numEl);cell.appendChild(snoteEl);cell.appendChild(chordEl);cell.appendChild(annEl);
  cell.appendChild(delBtn);cell.appendChild(barBottom);
  cell.addEventListener('dragstart',function(e){
    dragSrc=cell;cell.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',si+','+bi);
    var ghost=cell.cloneNode(true);
    ghost.style.cssText='position:fixed;left:-9999px;top:-9999px;width:'+cell.offsetWidth+'px;opacity:.95;transform:rotate(2deg);box-shadow:0 10px 30px rgba(0,0,0,.22);pointer-events:none;border-radius:var(--radius)';
    document.body.appendChild(ghost);e.dataTransfer.setDragImage(ghost,cell.offsetWidth/2,cell.offsetHeight/2);
    setTimeout(function(){if(ghost.parentNode)ghost.parentNode.removeChild(ghost)},0);
  });
  cell.addEventListener('dragend',function(){cell.classList.remove('dragging');document.querySelectorAll('.drag-over-left').forEach(function(el){el.classList.remove('drag-over-left')});dragSrc=null});
  barCol.appendChild(cell);
  return barCol;
}

// ── Rhythm picker: full pattern ──
function buildRhythmPicker(){
  var p=document.getElementById('rhythmPicker');p.innerHTML='';
  function addTitle(t){var d=document.createElement('div');d.className='picker-title';d.textContent=t;p.appendChild(d)}
  function addLabel(t){var d=document.createElement('div');d.className='picker-group-label';d.textContent=t;p.appendChild(d)}
  function addSep(){var d=document.createElement('div');d.className='picker-sep';p.appendChild(d)}
  function addGrid(items){var g=document.createElement('div');g.className='picker-grid';items.forEach(function(i){g.appendChild(i)});p.appendChild(g)}
  function mkItem(id,label,onclick){
    var el=document.createElement('div');el.className='picker-item';
    var row=document.createElement('div');row.style.cssText='display:flex;align-items:center;justify-content:center;gap:2px;flex:1';
    var ic=svgEl(id,'note-icon-sm');if(ic)row.appendChild(ic);
    el.appendChild(row);
    if(label){var lb=document.createElement('div');lb.className='picker-item-label';lb.textContent=label;el.appendChild(lb)}
    el.onclick=function(e){e.stopPropagation();onclick()};return el;
  }
  addTitle('Rhythm Pattern');
  PICKER_GROUPS.forEach(function(group,idx){
    if(idx)addSep();
    addLabel(group.label);
    addGrid(group.ids.map(function(id){
      return mkItem(id,(NOTE_META[id]&&NOTE_META[id].label)||id,function(){applyRhythmPattern([id])});
    }));
  });
  var clr=document.createElement('button');clr.className='picker-clear';clr.textContent='✕  clear rhythm';
  clr.onclick=function(){clearRhythmBar()};p.appendChild(clr);
}

function openRhythmPicker(si,bi,anchor){
  if(!EDIT_MODE)return;
  rhythmActiveBarRef={si:si,bi:bi};
  var picker=document.getElementById('rhythmPicker');
  var rect=anchor.getBoundingClientRect();
  var left=Math.min(rect.left,window.innerWidth-390);
  var top=rect.bottom+6;
  if(top+520>window.innerHeight)top=rect.top-530;
  picker.style.left=left+'px';picker.style.top=Math.max(8,top)+'px';
  picker.classList.add('open');
  document.getElementById('rhythmOverlay').classList.add('open');
}
function applyRhythmPattern(ids){
  if(!rhythmActiveBarRef)return;
  var bar=SECTIONS[rhythmActiveBarRef.si].bars[rhythmActiveBarRef.bi];
  bar.r=ids.slice();bar.rhythmOn=true;bar.rhythmOff=false;
  closeAllRhythmPopups();render();
}
function clearRhythmBar(){
  if(!rhythmActiveBarRef)return;
  var bar=SECTIONS[rhythmActiveBarRef.si].bars[rhythmActiveBarRef.bi];
  bar.r=[];bar.rhythmOn=false;bar.rhythmOff=false;
  closeAllRhythmPopups();render();
}

// ── Beat picker: per-slot ──
function buildBeatPicker(){
  var notes=document.getElementById('bpNotes');notes.innerHTML='';
  BEAT_KEYS.forEach(function(id){
    var item=document.createElement('div');item.className='beat-picker-item';
    var icon=svgEl(id,'note-icon-sm');if(icon)item.appendChild(icon);
    item.dataset.id=id;
    item.onclick=function(e){e.stopPropagation();applyBeat(id)};
    notes.appendChild(item);
  });
}
function openBeatPicker(si,bi,slotIdx,anchor){
  if(!EDIT_MODE)return;
  rhythmActiveBeatRef={si:si,bi:bi,slotIdx:slotIdx};
  var bp=document.getElementById('beatPicker');
  var curId=SECTIONS[si].bars[bi].r[slotIdx];
  bp.querySelectorAll('.beat-picker-item').forEach(function(el){
    el.classList.toggle('selected',el.dataset.id===curId);
  });
  var rect=anchor.getBoundingClientRect();
  var left=Math.min(rect.left,window.innerWidth-390);
  var top=rect.bottom+4;
  if(top+200>window.innerHeight)top=rect.top-210;
  bp.style.left=left+'px';bp.style.top=Math.max(8,top)+'px';
  bp.classList.add('open');
  document.getElementById('rhythmOverlay').classList.add('open');
}
function applyBeat(id){
  if(!rhythmActiveBeatRef)return;
  var bar=SECTIONS[rhythmActiveBeatRef.si].bars[rhythmActiveBeatRef.bi];
  bar.r[rhythmActiveBeatRef.slotIdx]=id;bar.rhythmOn=true;bar.rhythmOff=false;
  closeAllRhythmPopups();render();
}
function addBeatAfter(){
  if(!rhythmActiveBeatRef)return;
  var bar=SECTIONS[rhythmActiveBeatRef.si].bars[rhythmActiveBeatRef.bi];
  var r=bar.r;
  r.splice(rhythmActiveBeatRef.slotIdx+1,0,'q');
  bar.rhythmOn=true;bar.rhythmOff=false;
  closeAllRhythmPopups();render();
}
function deleteBeat(){
  if(!rhythmActiveBeatRef)return;
  var bar=SECTIONS[rhythmActiveBeatRef.si].bars[rhythmActiveBeatRef.bi];
  var r=bar.r;
  r.splice(rhythmActiveBeatRef.slotIdx,1);
  if(!r.length){bar.rhythmOn=false;bar.rhythmOff=false;}
  closeAllRhythmPopups();render();
}
function clearBeatBar(){
  if(!rhythmActiveBeatRef)return;
  var bar=SECTIONS[rhythmActiveBeatRef.si].bars[rhythmActiveBeatRef.bi];
  bar.r=[];bar.rhythmOn=false;bar.rhythmOff=false;
  closeAllRhythmPopups();render();
}
function closeAllRhythmPopups(){
  document.getElementById('rhythmPicker').classList.remove('open');
  document.getElementById('beatPicker').classList.remove('open');
  document.getElementById('rhythmOverlay').classList.remove('open');
  rhythmActiveBarRef=null;rhythmActiveBeatRef=null;
}

function copyAiPrompt(btn){
  function done(){if(btn){btn.textContent='copied';setTimeout(function(){btn.textContent='ai prompt'},1400)}toast('AI prompt copied ✓')}
  function fallbackCopy(){
    var tmp=document.createElement('textarea');
    tmp.value=AI_START_PROMPT;tmp.setAttribute('readonly','');
    tmp.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(tmp);tmp.select();document.execCommand('copy');document.body.removeChild(tmp);done();
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(AI_START_PROMPT).then(done).catch(fallbackCopy);
  }else{
    fallbackCopy();
  }
}

function makeFooterCtrl(arr,idx,renderFn,vertical){
  var wrap=document.createElement('div');wrap.className=vertical?'fn-ctrl':'fl-ctrl';
  var up=document.createElement('button');up.className='fic-btn';up.textContent='↑';up.title='Move up';
  up.disabled=(idx===0);
  up.onclick=function(e){e.stopPropagation();var a=arr.splice(idx,1)[0];arr.splice(idx-1,0,a);renderFn()};
  var dn=document.createElement('button');dn.className='fic-btn';dn.textContent='↓';dn.title='Move down';
  dn.disabled=(idx===arr.length-1);
  dn.onclick=function(e){e.stopPropagation();var a=arr.splice(idx,1)[0];arr.splice(idx+1,0,a);renderFn()};
  var dl=document.createElement('button');dl.className='fic-btn fic-del';dl.textContent='×';dl.title='Delete';
  dl.onclick=function(e){e.stopPropagation();arr.splice(idx,1);renderFn()};
  wrap.appendChild(up);wrap.appendChild(dn);wrap.appendChild(dl);
  return wrap;
}
function makeNoteCard(text,ni){
  var card=document.createElement('div');card.className='footer-note-card';
  var ta=document.createElement('textarea');ta.className='footer-note-ta';ta.value=text||'';
  ta.oninput=(function(i){return function(){FOOTER.notes[i]=this.value}})(ni);
  ta.onpaste=function(e){
    var data=(e.clipboardData||window.clipboardData);if(!data)return;
    var text=data.getData('text/plain');if(!text)return;
    e.preventDefault();this.setRangeText(text,this.selectionStart,this.selectionEnd,'end');this.dispatchEvent(new Event('input',{bubbles:true}));
  };
  ta.onmousedown=ta.onclick=function(e){e.stopPropagation()};
  card.appendChild(ta);
  card.appendChild(makeFooterCtrl(FOOTER.notes,ni,renderFooter,true));
  return card;
}
function renderFooter(){
  var existing=document.getElementById('footer-section');if(existing)existing.remove();
  var sheet=document.getElementById('sheet');
  var footer=document.createElement('div');footer.id='footer-section';
  // Notes section
  var notesHead=document.createElement('div');notesHead.className='footer-head';notesHead.textContent='notes';
  footer.appendChild(notesHead);
  if(!FOOTER.notes)FOOTER.notes=[];
  var list=document.createElement('div');list.className='footer-notes-list';
  FOOTER.notes.forEach(function(n,ni){list.appendChild(makeNoteCard(n,ni,list))});
  footer.appendChild(list);
  var addNoteBtn=document.createElement('button');addNoteBtn.className='footer-add-note';addNoteBtn.textContent='+ add note';
  addNoteBtn.onclick=function(){FOOTER.notes.push('');renderFooter()};
  footer.appendChild(addNoteBtn);
  sheet.appendChild(footer);
}

function setupDrop(row){
  row.addEventListener('dragover',function(e){e.preventDefault();row.classList.add('drag-over');var after=getAfter(row,e.clientX);document.querySelectorAll('.drag-over-left').forEach(function(el){el.classList.remove('drag-over-left')});if(after)after.classList.add('drag-over-left')});
  row.addEventListener('dragleave',function(e){if(!row.contains(e.relatedTarget)){row.classList.remove('drag-over');document.querySelectorAll('.drag-over-left').forEach(function(el){el.classList.remove('drag-over-left')})}});
  row.addEventListener('drop',function(e){
    e.preventDefault();row.classList.remove('drag-over');document.querySelectorAll('.drag-over-left').forEach(function(el){el.classList.remove('drag-over-left')});
    if(!dragSrc)return;
    var parts=e.dataTransfer.getData('text/plain').split(',');var fromSi=parseInt(parts[0]),fromBi=parseInt(parts[1]);var toSi=parseInt(row.dataset.si);
    var after=getAfter(row,e.clientX);var toBi=after?parseInt(after.dataset.bi):SECTIONS[toSi].bars.length;
    var moved=SECTIONS[fromSi].bars.splice(fromBi,1)[0];if(fromSi===toSi&&toBi>fromBi)toBi--;
    SECTIONS[toSi].bars.splice(toBi,0,moved);render();toast('สลับห้องแล้ว ✓');
  });
}
function getAfter(row,x){var cells=Array.from(row.querySelectorAll('.bar-cell:not(.dragging)'));var res=null,best=-Infinity;cells.forEach(function(c){var box=c.getBoundingClientRect();var offset=x-box.left-box.width/2;if(offset<0&&offset>best){best=offset;res=c}});return res}

function openColorPicker(si,tagEl,e){
  e.stopPropagation();pickerSi=si;
  var popup=document.getElementById('colorPopup');var col=SECTIONS[si].color||PRESETS[0];
  function buildSwatches(containerId, presets, label){
    var sw=document.getElementById(containerId);sw.innerHTML='';
    presets.forEach(function(p){var s=document.createElement('div');s.className='swatch'+(p.bar===col.bar?' active':'');s.style.background=p.bar;s.title=label+' '+p.bar;s.onclick=function(){applyColor(si,p);closeColorPicker()};sw.appendChild(s)});
  }
  buildSwatches('swatches-light', LIGHT_PRESETS, 'Light');
  buildSwatches('swatches', PRESETS, 'Base');
  var hexInput=document.getElementById('hexInput');var hexPreview=document.getElementById('hexPreview');
  hexInput.value=col.bar;hexPreview.style.background=col.bar;
  hexInput.oninput=function(){var v=this.value;if(!v.startsWith('#'))v='#'+v;hexPreview.style.background=isHex(v)?v:'#ccc';if(isHex(v))applyColor(si,colorFromBar(v))};
  hexInput.onkeydown=function(e){if(e.key==='Enter')closeColorPicker()};
  var rect=tagEl.getBoundingClientRect();popup.style.top=(rect.bottom+6)+'px';popup.style.left=rect.left+'px';

var AUTO_SCROLL_PLAYING=false,AUTO_SCROLL_RAF=0,AUTO_SCROLL_START=0,AUTO_SCROLL_FROM=0,AUTO_SCROLL_TO=0,AUTO_SCROLL_DURATION=0,AUTO_SCROLL_IGNORE_UNTIL=0;
function parseDurationSeconds(v){
  v=String(v||'').trim();
  if(!v)return 0;
  if(/^\d+(\.\d+)?$/.test(v))return Math.max(0,parseFloat(v));
  var p=v.split(':').map(function(x){return parseFloat(x)||0});
  if(p.length===2)return p[0]*60+p[1];
  if(p.length===3)return p[0]*3600+p[1]*60+p[2];
  return 0;
}
function autoScrollSeconds(){
  return parseDurationSeconds(SETTINGS.autoScrollDuration)||180;
}
function updateAutoScrollControls(){
  var dur=document.getElementById('scroll-duration');

  var sv=document.getElementById('scroll-speed-val');

  if(AUTO_SCROLL_PLAYING)resetAutoScrollTiming();
  updateAutoScrollControls();
}
function resetAutoScrollTiming(){
  var now=performance.now();
  AUTO_SCROLL_FROM=window.scrollY||window.pageYOffset||0;
  if(AUTO_SCROLL_TO<=AUTO_SCROLL_FROM+1)return;
  var total=Math.max(1,AUTO_SCROLL_TO-AUTO_SCROLL_FROM);
  var remaining=total/(AUTO_SCROLL_TO||total);
  AUTO_SCROLL_DURATION=autoScrollSeconds()*remaining/Math.max(.5,SETTINGS.autoScrollSpeed||1);
  AUTO_SCROLL_START=now;
}
function pauseAutoScroll(){
  AUTO_SCROLL_PLAYING=false;
  if(AUTO_SCROLL_RAF)cancelAnimationFrame(AUTO_SCROLL_RAF);

  updateAutoScrollControls();
}
function jumpAutoScrollSection(dir){
  var sections=[].slice.call(document.querySelectorAll('.section:not(.note-type-sec)'));
  if(!sections.length)return;
  var y=window.scrollY||window.pageYOffset||0;
  var target=null;
  if(dir>0){
    for(var i=0;i<sections.length;i++){
      var top=sections[i].getBoundingClientRect().top+y;
      if(top>y+8){target=sections[i];break;}
    }
  }else{
    for(var j=sections.length-1;j>=0;j--){
      var ptop=sections[j].getBoundingClientRect().top+y;
      if(ptop<y-8){target=sections[j];break;}
    }
  }
  if(!target)return toast(dir>0?'ไม่มี section ถัดไป':'ไม่มี section ก่อนหน้า');
  AUTO_SCROLL_IGNORE_UNTIL=Date.now()+180;
  window.scrollTo(0,Math.max(0,target.getBoundingClientRect().top+y));
  if(AUTO_SCROLL_PLAYING)resetAutoScrollTiming();
}
function startAutoScroll(){
  if(EDIT_MODE)setDisplayMode();
  document.body.classList.add('autoscroll-on');
  var doc=document.documentElement;
  AUTO_SCROLL_FROM=window.scrollY||window.pageYOffset||0;
  AUTO_SCROLL_TO=Math.max(0,doc.scrollHeight-window.innerHeight);
  if(AUTO_SCROLL_TO<=AUTO_SCROLL_FROM+2){document.body.classList.remove('autoscroll-on');return toast('ถึงท้ายหน้าแล้ว');}
  if(!parseDurationSeconds(SETTINGS.autoScrollDuration))toast('ใส่ duration เพื่อความแม่นยำ');
  var total=Math.max(1,AUTO_SCROLL_TO-AUTO_SCROLL_FROM);
  var remaining=total/(AUTO_SCROLL_TO||total);
  AUTO_SCROLL_DURATION=autoScrollSeconds()*remaining/Math.max(.5,SETTINGS.autoScrollSpeed||1);
  AUTO_SCROLL_START=performance.now();
  AUTO_SCROLL_PLAYING=true;
  updateAutoScrollControls();
  function step(now){
    if(!AUTO_SCROLL_PLAYING)return;
    var t=Math.min(1,(now-AUTO_SCROLL_START)/(AUTO_SCROLL_DURATION*1000));
    var y=AUTO_SCROLL_FROM+(AUTO_SCROLL_TO-AUTO_SCROLL_FROM)*t;
    AUTO_SCROLL_IGNORE_UNTIL=Date.now()+120;
    window.scrollTo(0,y);
    if(t>=1){pauseAutoScroll();toast('จบเพลงแล้ว ✓');return;}
    AUTO_SCROLL_RAF=requestAnimationFrame(step);
  }
  AUTO_SCROLL_RAF=requestAnimationFrame(step);
}
function toggleAutoScroll(){
  if(AUTO_SCROLL_PLAYING)pauseAutoScroll();
  else startAutoScroll();
}
function stopAutoScrollFromUser(){
  if(!AUTO_SCROLL_PLAYING||Date.now()<AUTO_SCROLL_IGNORE_UNTIL)return;

var NOTE_IDX={'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'Fb':4,'F':5,'E#':5,'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11,'Cb':11,'B#':0};
var FLAT_SCALE=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
var SHARP_SCALE=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var PREF_FLAT=[false,true,false,true,false,true,false,false,true,false,true,false];
function noteFromSemitone(s,flats){return(flats?FLAT_SCALE:SHARP_SCALE)[((s%12)+12)%12]}
function transposeToken(t,steps,flats){
  if(!t||t==='—')return t;
  var root,rest;
  if(t.length>=2&&(t[1]==='#'||t[1]==='b')&&NOTE_IDX.hasOwnProperty(t.slice(0,2))){root=t.slice(0,2);rest=t.slice(2)}
  else if(NOTE_IDX.hasOwnProperty(t[0])){root=t[0];rest=t.slice(1)}
  else return t;
  var bassIdx=rest.lastIndexOf('/');
  if(bassIdx>=0){
    var quality=rest.slice(0,bassIdx),bass=rest.slice(bassIdx+1);
    var bm=bass.match(/^([A-G][#b]?)(.*)$/);
    if(bm&&NOTE_IDX.hasOwnProperty(bm[1])){
      var bassNote=noteFromSemitone(((NOTE_IDX[bm[1]]+steps)%12+12)%12,flats)+bm[2];
      return noteFromSemitone(((NOTE_IDX[root]+steps)%12+12)%12,flats)+quality+'/'+bassNote;
    }
  }
  return noteFromSemitone(((NOTE_IDX[root]+steps)%12+12)%12,flats)+rest;
}
function transposeStr(str,steps,flats){
  if(!str||str==='—')return str;
  return str.replace(/[A-G][#b]?[^|\-\s]*/g,function(m){return transposeToken(m,steps,flats)});
}
function transposeKey(steps){
  if(!ORIG_SECTIONS){ORIG_SECTIONS=JSON.parse(JSON.stringify(SECTIONS));var ke=document.getElementById('meta-key');ORIG_KEY=ke?ke.value:'';}
  TRANSPOSE+=steps;
  var ke=document.getElementById('meta-key');
  var kv=ke?ke.value:'';
  var km=kv.match(/^([A-G][#b]?)/);
  var curSemi=km?NOTE_IDX[km[1]]:3;
  var newSemi=((curSemi+steps)%12+12)%12;
  var flats=PREF_FLAT[newSemi];
  SECTIONS.forEach(function(sec){
    if(sec.type==='note')return;
    (sec.bars||[]).forEach(function(bar){bar.c=transposeStr(bar.c,steps,flats)});
  });
  if(ke&&km){ke.value=noteFromSemitone(newSemi,flats)+kv.slice(km[1].length);saveMeta();}
  var v=document.getElementById('key-val');
  if(v){v.textContent=TRANSPOSE===0?'±0':(TRANSPOSE>0?'+'+TRANSPOSE:''+TRANSPOSE);v.classList.toggle('transposed',TRANSPOSE!==0);}
  SETTINGS.transpose=TRANSPOSE;
  render();
  toast('Key '+(steps>0?'▲ +':'▼ ')+Math.abs(steps)+' st');
}

function respellNote(note,toFlat){
  var m=toFlat?{'C#':'Db','D#':'Eb','F#':'Gb','G#':'Ab','A#':'Bb'}:{'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};
  return m[note]||note;
}
function respellToken(tok,toFlat){
  tok=(tok||'').trim();if(!tok||tok==='—')return tok;
  var m=tok.match(/^([A-G][#b]?)(.*)/);if(!m)return tok;
  var root=respellNote(m[1],toFlat),rest=m[2];
  var si=rest.lastIndexOf('/');
  if(si>=0){
    var q=rest.slice(0,si),b=rest.slice(si+1);
    var bm=b.match(/^([A-G][#b]?)(.*)/);
    return root+q+'/'+(bm?respellNote(bm[1],toFlat)+bm[2]:b);
  }
  return root+rest;
}
function respellStr(str,toFlat){
  if(!str||str==='—')return str;
  if(str.indexOf('|')>=0)return str.split('|').map(function(p){return respellToken(p,toFlat);}).join(' | ');
  var dm=str.match(/^([A-G][#b]?[^\-]*)-([A-G][#b]?.*)$/);
  if(dm)return respellToken(dm[1],toFlat)+'-'+respellToken(dm[2],toFlat);
  return respellToken(str,toFlat);
}

async function lookupIndexMeta(){
  var path=location.pathname.replace(/^\/+/,'');
  var parts=path.split('/');
  var file=parts.pop()||'';
  var band=parts.pop()||'';
  var titleSlug=slugText(usefulMetaValue('tb-filename')||titleFromDocument());
  var urls=['index.html','../index.html','/index.html'];
  for(var ui=0;ui<urls.length;ui++){
    try{
      var res=await fetch(urls[ui],{cache:'no-store'});
      if(!res.ok)continue;
      var txt=await res.text();
      var m=txt.match(/var SONGS\s*=\s*(\[[\s\S]*?\]);/);
      if(!m)continue;
      var songs=JSON.parse(m[1]);
      var found=songs.find(function(s){
        var songFile=s.file||'';
        var songSlug=slugText(s.title||songFile.replace(/\.html$/,''));
        return s.href===path
          ||s.href===band+'/'+file
          ||songFile===file&&(!band||s.bandId===band)
          ||titleSlug&&(songSlug===titleSlug||songFile===titleSlug+'.html');
      });
      if(found)return found;
    }catch(e){}
  }
  return null;
}

  ];
  var LEGACY_ACCENT_MAP = {
    '#3b82f6': LUMINOUS_PRESETS[0], '#007aff': LUMINOUS_PRESETS[0],
    '#ffcc00': LUMINOUS_PRESETS[1], '#f59e0b': LUMINOUS_PRESETS[6],
    '#34c759': LUMINOUS_PRESETS[2], '#059669': LUMINOUS_PRESETS[2],
    '#af52de': LUMINOUS_PRESETS[3], '#8b5cf6': LUMINOUS_PRESETS[3],
    '#ff2d55': LUMINOUS_PRESETS[4], '#ff3b30': LUMINOUS_PRESETS[5],
    '#ff9500': LUMINOUS_PRESETS[6], '#ff6b30': LUMINOUS_PRESETS[6],
    '#64748b': LUMINOUS_PRESETS[7], '#1f2937': LUMINOUS_PRESETS[8]
  };
  PRESETS = LUMINOUS_PRESETS;
  var CONTENT_FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Noto Sans Thai", Thonburi, sans-serif';
  CHORD_FONT = CONTENT_FONT;
  CHORD_SIZE = 15;
  NOTE_SIZE = 16;
  SETTINGS.chordFont = CONTENT_FONT;
  document.documentElement.style.setProperty('--chord-font', CONTENT_FONT);
  document.body.classList.remove('notes-hidden');
  var FOCUS_KEY = 'bandsheet-focus:' + window.location.pathname;
  var FOCUS_ANCHOR = null;
  try { FOCUS_ANCHOR = JSON.parse(sessionStorage.getItem(FOCUS_KEY) || 'null'); }
  catch (error) { FOCUS_ANCHOR = null; }

  function sameFocus(a, b) {
    return !!a && !!b && a.type === b.type && Number(a.si) === Number(b.si) &&
      (a.type !== 'bar' || Number(a.bi) === Number(b.bi));
  }

  function saveFocusAnchor() {
    try {
      if (FOCUS_ANCHOR) sessionStorage.setItem(FOCUS_KEY, JSON.stringify(FOCUS_ANCHOR));
      else sessionStorage.removeItem(FOCUS_KEY);
    } catch (error) {}
  }

  function focusLabel(anchor) {
    var section = SECTIONS[Number(anchor.si)] || {};
    var label = String(section.label || 'Section');
    if (anchor.type === 'bar') {
      var bar = (section.bars || [])[Number(anchor.bi)] || {};
      var chord = String(bar.c || '').trim();
      return label + (chord ? ' · ' + chord : '');
    }
    return label;
  }

  function focusElement(anchor) {
    if (!anchor) return null;
    var section = document.querySelector('.section[data-si="' + Number(anchor.si) + '"]');
    if (!section) return null;
    if (anchor.type === 'bar') {
      return section.querySelector('.bar-cell[data-bi="' + Number(anchor.bi) + '"]');
    }
    return section.querySelector('.section-tag');
  }

  function ensureFocusReturn() {
    var button = document.getElementById('focus-return');
    if (button) return button;
    button = document.createElement('button');
    button.id = 'focus-return';
    button.className = 'focus-return';
    button.type = 'button';
    button.onclick = function () { window.returnToFocus(); };
    document.body.appendChild(button);
    return button;
  }

  function renderFocusAnchor() {
    document.querySelectorAll('.focus-anchor-section').forEach(function (el) { el.classList.remove('focus-anchor-section'); });
    document.querySelectorAll('.contains-focus-anchor').forEach(function (el) { el.classList.remove('contains-focus-anchor'); });
    document.querySelectorAll('.focus-anchor-target').forEach(function (el) { el.classList.remove('focus-anchor-target'); });
    var button = ensureFocusReturn();
    var target = focusElement(FOCUS_ANCHOR);
    if (!FOCUS_ANCHOR || !target) {
      FOCUS_ANCHOR = null;
      saveFocusAnchor();
      document.body.classList.remove('has-focus-anchor');
      button.textContent = '';
      return;
    }
    var section = target.closest('.section');
    if (FOCUS_ANCHOR.type === 'bar') {
      target.classList.add('focus-anchor-target');
      if (section) section.classList.add('contains-focus-anchor');
    } else if (section) {
      section.classList.add('focus-anchor-section');
    }
    button.textContent = '↩ ' + focusLabel(FOCUS_ANCHOR);
    button.title = 'Return to focused position';
    document.body.classList.add('has-focus-anchor');
  }

  function setFocusAnchor(next) {
    FOCUS_ANCHOR = sameFocus(FOCUS_ANCHOR, next) ? null : next;
    saveFocusAnchor();
    renderFocusAnchor();
  }

  function bindFocusAnchors() {
    ensureFocusReturn();
    document.querySelectorAll('.section[data-si]').forEach(function (section) {
      var si = Number(section.dataset.si);
      var source = SECTIONS[si];
      if (!source || source.type === 'note') return;
      var tag = section.querySelector('.section-tag');
      if (tag && !tag.dataset.focusBound) {
        tag.dataset.focusBound = '1';
        tag.addEventListener('click', function (event) {
          if (EDIT_MODE) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          setFocusAnchor({ type: 'section', si: si });
        }, true);
      }
      section.querySelectorAll('.bar-cell[data-bi]').forEach(function (cell) {
        if (cell.dataset.focusBound) return;
        cell.dataset.focusBound = '1';
        cell.title = 'Tap to focus this bar';
        cell.addEventListener('click', function (event) {
          if (EDIT_MODE) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          setFocusAnchor({ type: 'bar', si: si, bi: Number(cell.dataset.bi) });
        }, true);
      });
    });
    renderFocusAnchor();
  }

  window.returnToFocus = function () {
    var target = focusElement(FOCUS_ANCHOR);
    if (!target) return renderFocusAnchor();
    var section = target.closest('.section');
    if (FOCUS_ANCHOR.type === 'bar' && section && document.body.classList.contains('mobile-lyric')) {
      closeChordPeeks(section);
      section.classList.add('chords-open');
      var peek = section.querySelector('.chord-peek-btn');
      if (peek) peek.textContent = 'hide chord';
    }
    target.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
  };

  function headingColor(source) {
    var original = source || LUMINOUS_PRESETS[0];
    var mapped = LEGACY_ACCENT_MAP[String(original.bar || '').toLowerCase()];
    if (mapped) return mapped;
    return {
      bar: original.bar || '#275dff',
      bg: original.bg || blend(original.bar || '#275dff', '#ffffff', 0.91),
      lbl: original.lbl || blend(original.bar || '#275dff', '#132033', 0.46)
    };
  }

  function applyPrototypeTheme() {
    document.querySelectorAll('#sheet .section[data-si]').forEach(function (sectionEl) {
      var si = parseInt(sectionEl.dataset.si, 10);
      var section = SECTIONS[si];
      if (!section) return;
      var tone = headingColor(section.color || PRESETS[si % PRESETS.length]);

      sectionEl.querySelectorAll('.section-tag').forEach(function (tag) {
        tag.style.background = tone.bg;
        tag.style.color = tone.lbl;
        tag.style.borderColor = tone.bar;
      });
      sectionEl.querySelectorAll('.rte-editor').forEach(function (editor) {
        editor.style.borderLeftColor = '#d8e1ed';
        editor.style.fontSize = NOTE_SIZE + 'px';
        editor.style.lineHeight = '1.5';
        editor.style.fontWeight = '450';
      });
      sectionEl.querySelectorAll('.bar-chord,.bar-chord-part').forEach(function (chord) {
        chord.style.fontFamily = 'var(--content-font)';
        chord.style.fontSize = CHORD_SIZE + 'px';
        chord.style.fontWeight = '600';
      });
      sectionEl.querySelectorAll('.row-repeat-badge').forEach(function (badge) {
        badge.style.background = '#edf2fa';
        badge.style.color = '#46566d';
      });
      sectionEl.querySelectorAll('.bar-cell').forEach(function (cell) {
        cell.style.setProperty('--bar-strip', '#d8e1ed');
        cell.style.setProperty('--bar-num-color', '#a5b1c1');
        cell.style.setProperty('--bar-accent', '#d8e1ed');
        if (cell.classList.contains('highlighted')) {
          cell.style.background = '#f8fafd';
          cell.style.borderColor = '#275dff';
          cell.style.outlineColor = '#275dff';
          cell.style.boxShadow = 'inset 0 0 0 1px #275dff';
        } else {
          cell.style.background = '#f8fafd';
          cell.style.borderColor = '#d8e1ed';
          cell.style.boxShadow = 'none';
        }
        var number = cell.querySelector('.bar-num');
        var note = cell.querySelector('.bar-snote');
        if (number && !cell.classList.contains('highlighted')) number.style.color = '#a5b1c1';
        if (note && !cell.classList.contains('highlighted')) note.style.color = '#46566d';
      });
    });
  }

  function lyricLines(noteSection) {
    var editor = noteSection.querySelector('.rte-editor');
    if (!editor) return [];
    return (editor.innerText || editor.textContent || '')
      .split(/\n+/)
      .map(function (line) { return line.trim(); })
      .filter(Boolean);
  }

  function addChordPeek(sectionEl) {
    var head = sectionEl.querySelector('.section-head');
    if (!head || head.querySelector('.chord-peek-btn')) return;
    var button = document.createElement('button');
    button.className = 'chord-peek-btn';
    button.textContent = 'show chord';
    button.onclick = function (event) {
      event.stopPropagation();
      var willOpen = !sectionEl.classList.contains('chords-open');
      closeChordPeeks(sectionEl);
      sectionEl.classList.toggle('chords-open', willOpen);
      button.textContent = willOpen ? 'hide chord' : 'show chord';
    };
    head.appendChild(button);
  }

  function closeChordPeeks(except) {
    document.querySelectorAll('.section.chords-open').forEach(function (section) {
      if (section === except) return;
      section.classList.remove('chords-open');
      var button = section.querySelector('.chord-peek-btn');
      if (button) button.textContent = 'show chord';
    });
  }

  function makeBandLyricCue(lyric) {
    var cue = document.createElement('div');
    cue.className = 'band-lyric-cue';
    var lines = lyricLines(lyric);
    if (lines.length) {
      var first = document.createElement('span');
      first.className = 'cue-first';
      first.textContent = lines[0];
      cue.appendChild(first);
      if (lines.length > 1) {
        var last = document.createElement('span');
        last.className = 'cue-last';
        last.textContent = '→ ' + lines[lines.length - 1];
        cue.appendChild(last);
      }
    }
    return cue;
  }

  function pairChordAndLyrics() {
    if (EDIT_MODE) return;
    var sheet = document.getElementById('sheet');
    if (!sheet) return;
    var sections = Array.prototype.slice.call(sheet.querySelectorAll(':scope > .section'));
    for (var i = 0; i < sections.length; i++) {
      var chord = sections[i];
      var chordIndex = parseInt(chord.dataset.si, 10);
      if (isNaN(chordIndex) || (SECTIONS[chordIndex] && SECTIONS[chordIndex].type === 'note')) continue;
      addChordPeek(chord);
      var lyric = sections[i + 1];
      var lyricIndex = lyric ? parseInt(lyric.dataset.si, 10) : -1;
      var hasLyric = !isNaN(lyricIndex) && SECTIONS[lyricIndex] && SECTIONS[lyricIndex].type === 'note';
      if (hasLyric) lyric.insertBefore(makeBandLyricCue(lyric), lyric.firstChild);

      var pair = document.createElement('div');
      pair.className = 'section-pair' + (hasLyric ? '' : ' no-lyric');
      sheet.insertBefore(pair, chord);
      pair.appendChild(chord);
      if (hasLyric) {
        pair.appendChild(lyric);
        i += 1;
      } else {
        var placeholder = document.createElement('div');
        placeholder.className = 'lyric-placeholder';
        placeholder.setAttribute('aria-hidden', 'true');
        pair.appendChild(placeholder);
      }
    }
    requestAnimationFrame(syncPairOffsets);
  }

  function syncPairOffsets() {
    document.querySelectorAll('.section-pair').forEach(function (pair) {
      if (window.innerWidth <= 760) {
        pair.style.removeProperty('--pair-head-offset');
        return;
      }
      var chord = pair.querySelector(':scope > .section:not(.note-type-sec)');
      var head = chord && chord.querySelector('.section-head');
      if (!head) return;
      var style = window.getComputedStyle(head);
      var offset = head.getBoundingClientRect().height + (parseFloat(style.marginBottom) || 0);
      pair.style.setProperty('--pair-head-offset', offset + 'px');
    });
  }

  var MOBILE_VIEW = 'lyric';
  window.setMobileView = function (mode) {
    var nextView = mode === 'lyric' ? 'lyric' : 'band';
    if (nextView !== MOBILE_VIEW) closeChordPeeks();
    MOBILE_VIEW = nextView;
    document.body.classList.toggle('mobile-band', MOBILE_VIEW === 'band');
    document.body.classList.toggle('mobile-lyric', MOBILE_VIEW === 'lyric');
    var band = document.getElementById('band-view-btn');
    var lyric = document.getElementById('lyric-view-btn');
    if (band) band.classList.toggle('active', MOBILE_VIEW === 'band');
    if (lyric) lyric.classList.toggle('active', MOBILE_VIEW === 'lyric');
  };

  window.toggleToolbarMore = function () {
    var open = document.body.classList.toggle('toolbar-more-open');
    var button = document.getElementById('mobile-more-btn');
    if (button) button.setAttribute('aria-expanded', open ? 'true' : 'false');
  };

  function pruneLeanControls() {
    document.querySelectorAll('.section-actions .sec-btn').forEach(function (button) {
      var label = (button.textContent || '').trim().toLowerCase();
      if (label === 'renumber' || label.indexOf('reset') >= 0 || label.indexOf('↺') >= 0) {
        button.remove();
      }
    });
    document.querySelectorAll('.section-tag').forEach(function (tag) {
      tag.title = 'Double-click to edit · add cue after an em dash';
      var raw = (tag.textContent || '').trim();
      var match = raw.match(/^(.*?)\s+[—–-]\s+(.+)$/);
      tag.textContent = '';
      var name = document.createElement('span');
      name.className = 'section-name';
      name.textContent = match ? match[1] + ' —' : raw;
      tag.appendChild(name);
      if (match) {
        var detail = document.createElement('span');
        detail.className = 'section-detail';
        detail.textContent = match[2];
        tag.appendChild(detail);
      }
    });
  }

  window.toggleNotesView = function () {
    var hidden = document.body.classList.toggle('notes-hidden');
    var button = document.getElementById('notes-btn');
    if (button) button.classList.toggle('active', !hidden);
  };

  var renderCore = window.render;
  window.render = function () {
    renderCore();
    if (EDIT_MODE) document.body.classList.remove('toolbar-more-open');
    pruneLeanControls();
    applyPrototypeTheme();
    pairChordAndLyrics();
    window.setMobileView(MOBILE_VIEW);
    bindFocusAnchors();
  };

  pruneLeanControls();
  applyPrototypeTheme();
  pairChordAndLyrics();
  window.setMobileView(MOBILE_VIEW);
  bindFocusAnchors();
  window.addEventListener('resize', syncPairOffsets, { passive: true });
  var chordSizeValue = document.getElementById('chord-size-val');
  var noteSizeValue = document.getElementById('note-size-val');
  if (chordSizeValue) chordSizeValue.textContent = CHORD_SIZE;
  if (noteSizeValue) noteSizeValue.textContent = NOTE_SIZE;
  document.body.dataset.prototype = 'lean-80-20';
})();
</script>
</body></html>
